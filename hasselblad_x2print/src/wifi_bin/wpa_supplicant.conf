# wpa_supplicant.conf — X2D II 相机 STA 加入打印机热点(部署模板)
# deploy_and_join.sh 会把 {{SSID}}/{{PSK}} 替换为实参后推到相机
# /data/x2print/wifi/wpa_supplicant.conf, 本文件不直接上机。
#
# 相机侧事实(NOTES §14): bcmdhd 为 IAPSTA 构建, 手动 insmod 后 wlan0 已注册
# cfg80211, `wl join` 会被固件 prune(WLC_E_PRUNE reason 1)——必须走标准
# supplicant + nl80211。

# ctrl interface: 相机上 /tmp(wpas 目录)可写; wpa_cli -p /tmp/wpas 与之对话
ctrl_interface=/tmp/wpas

# STA 主动扫描 + 由 supplicant 选网(打印机热点在广播, 无需 ap_scan=2)
ap_scan=1

network={
    ssid="{{SSID}}"
    psk="{{PSK}}"

    # 米家打印机 1S 热点实测: WPA2-PSK/CCMP; 收紧 pairwise/group 可缩短
    # 协商, 若日后遇到 TKIP 混合网络再放开 group=CCMP TKIP
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    group=CCMP

    # 热点固定信道 1(2412MHz)。锁定扫描频点可明显加快关联; 换信道的环境
    # 请注释掉本行
    scan_freq=2412

    # 单网络场景给高优先级(防御性, 当前只有这一个 network 块)
    priority=10
}
